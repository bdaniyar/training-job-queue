[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "training-job-queue"
version = "0.1.0"
description = "PostgreSQL job queue with fenced leases and atomic database effects"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/training_queue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
